    const exportToCSV = (filename, rows) => {
      if (!rows || !rows.length) return;
      const separator = ',';
      const keys = Object.keys(rows[0]);
      const csvContent =
        '\uFEFF' +
        keys.join(separator) +
        '\n' +
        rows
          .map(row => {
            return keys
              .map(k => {
                let cell = row[k] === null || row[k] === undefined ? '' : row[k];
                cell = cell instanceof Date ? cell.toLocaleString() : cell.toString();
                cell = cell.replace(/"/g, '""');
                if (cell.search(/("|,|\n)/g) >= 0) cell = `"${cell}"`;
                return cell;
              })
              .join(separator);
          })
          .join('\n');

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    const exportToExcelWorkbook = (filename, projectsRows, deliverablesRows, teamRows) => {
      const renderTable = (title, rows) => {
        if (!rows || !rows.length) return '';
        const headers = Object.keys(rows[0]);
        return `
          <h3 style="font-family: Calibri, sans-serif; color: #064e3b; background: #d1fae5; padding: 8px;">${title}</h3>
          <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse; font-family: Calibri, sans-serif; font-size: 11pt;">
            <thead>
              <tr style="background-color: #065f46; color: #ffffff; font-weight: bold;">
                ${headers.map(h => `<th>${h}</th>`).join('')}
              </tr>
            </thead>
            <tbody>
              ${rows
                .map(
                  (r, idx) => `
                <tr style="background-color: ${idx % 2 === 0 ? '#ffffff' : '#f0fdf4'};">
                  ${headers.map(h => `<td>${r[h] !== null && r[h] !== undefined ? String(r[h]).replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''}</td>`).join('')}
                </tr>
              `
                )
                .join('')}
            </tbody>
          </table>
          <br/><br/>
        `;
      };

      const htmlDocument = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
          <head>
            <meta charset="UTF-8">
          </head>
          <body>
            <h2 style="font-family: Calibri, sans-serif; color: #065f46;">VIRINCHI DESIGN STUDIO & PMC — MASTER PROJECT TRACKER SHEET</h2>
            <p style="font-family: Calibri, sans-serif;">Supervisors: Sarthak Sir (Design Studio) & Harsh Sir (PMC) | Baseline Progress: 0%</p>
            ${renderTable('SHEET 1: MASTER PROJECTS OVERVIEW (14 ACTIVE PROJECTS)', projectsRows)}
            ${renderTable('SHEET 2: GRANULAR DELIVERABLES & FLOOR-WISE TRACKER (39 TASKS)', deliverablesRows)}
            ${renderTable('SHEET 3: DESIGNER WORKLOAD & ALLOCATION MATRIX (8 DESIGNERS)', teamRows)}
          </body>
        </html>
      `;

      const blob = new Blob([htmlDocument], { type: 'application/vnd.ms-excel;charset=utf-8;' });
      const link = document.createElement('a');
      const url = URL.createObjectURL(blob);
      link.setAttribute('href', url);
      link.setAttribute('download', filename);
      link.style.visibility = 'hidden';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    const STORAGE_KEY = 'virinchi_studio_moodboard_state_v1';

    const loadSavedState = () => {

        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    };

      const [checklists, setChecklists] = useState(() => savedState?.checklists || INITIAL_CHECKLISTS);

      const [selectedEmployeeId, setSelectedEmployeeId] = useState(() => savedState?.selectedEmployeeId || 'emp-1');
      const [inspectedEmployeeId, setInspectedEmployeeId] = useState(null);

      // Auto-save all state to browser localStorage so nothing is lost on refresh
      useEffect(() => {
        try {
          const stateToPersist = {
            version: '1.0',
            updatedAt: new Date().toISOString(),
            employees,
            projects,
            deliverables,
            designBriefs,
            checklists,
            issues,
            activities,
            meetings,
            roleMode,
            activeEmployeeId,
            activeTab,
            activeWorkbookSheet,
            selectedProjectId,
            projectViewSection,
            selectedEmployeeId

          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(stateToPersist));
        } catch (err) {
          // Ignore quota errors
        }
      }, [
        employees,
        projects,
        deliverables,
        designBriefs,
        checklists,
        issues,
        activities,
        meetings,
        roleMode,
        activeEmployeeId,
        activeTab,
        activeWorkbookSheet,
        selectedProjectId,
        projectViewSection,
        selectedEmployeeId
      ]);

      const [sheetDesignerFilter, setSheetDesignerFilter] = useState('all');
      const [sheetProjectFilter, setSheetProjectFilter] = useState('all');
      const [sheetStatusFilter, setSheetStatusFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const [showLogModal, setShowLogModal] = useState(false);
      const [showNewProjectModal, setShowNewProjectModal] = useState(false);
      const [showNewDeliverableModal, setShowNewDeliverableModal] = useState(false);
      const [showAiBriefGeneratorModal, setShowAiBriefGeneratorModal] = useState(false);
      const [newChecklistText, setNewChecklistText] = useState('');
      const [newChecklistCategory, setNewChecklistCategory] = useState('General Check');

      const [aiPromptInputs, setAiPromptInputs] = useState({
        whatDesigning: 'Residential Architecture (Option 1 & Option 2 Floor Plans & 3D)',
        companyAbout: 'Plot 18x55 West Facing in Indore — Option 1 (GF parking, drawing/living, lift well from parking, outside staircase; 1st Floor 1BHK, double-height hall, powder room; 2nd Floor 2BHK, walk-in wardrobe & toilet; Terrace & common toilet) & Option 2 (GF double-height parking + 1BHK; 1st Floor 1 bedroom with walk-in wardrobe, toilet & study; Terrace 1 bedroom).',
        targetAndVibe: 'Urban family in Indore seeking a modern, Vastu-aligned, airy multi-floor residence with double-height volumes and West-facade heat protection.'
      });

      const [toast, setToast] = useState(null);

      const showToastMessage = useCallback((msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      }, []);

      // 1. Backup Button Handler (.json download)
      const handleBackupJSON = useCallback(() => {
        const dateStamp = new Date().toISOString().split('T')[0];
        const backupPayload = {
          app: 'Virinchi Studio Moodboard & Tracker',
          version: '1.0',
          exportedAt: new Date().toISOString(),
          data: {
            employees,
            projects,
            deliverables,
            designBriefs,
            checklists,
            issues,
            activities,
            meetings,
            layoutState: {
              roleMode,
              activeEmployeeId,
              activeTab,
              activeWorkbookSheet,
              selectedProjectId,
              projectViewSection,
              selectedEmployeeId
            }
          }
        };

        const jsonString = JSON.stringify(backupPayload, null, 2);
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `virinchi_backup_${dateStamp}.json`;
        document.body.appendChild(link);
        link.click();

        showToastMessage(`Backup saved: virinchi_backup_${dateStamp}.json`);
      }, [
        employees,
        projects,
        deliverables,
        designBriefs,
        checklists,
        issues,
        activities,
        meetings,
        roleMode,
        activeEmployeeId,
        activeTab,
        activeWorkbookSheet,
        selectedProjectId,
        projectViewSection,
        selectedEmployeeId,
        showToastMessage
      ]);

      // 2 & 3. Restore Button & Auto-Load State Handler (.json upload + localStorage sync)
      const handleRestoreJSON = useCallback((event) => {
        const file = event.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const parsed = JSON.parse(e.target.result);
            const source = parsed.data || parsed;

            if (!source.projects && !source.deliverables && !source.designBriefs) {
              showToastMessage('Invalid backup file format. Please upload a valid Virinchi .json backup.', 'error');
              return;
            }

            const nextEmployees = Array.isArray(source.employees) ? source.employees : INITIAL_EMPLOYEES;
            const nextProjects = Array.isArray(source.projects) ? source.projects : INITIAL_PROJECTS;
            const nextDeliverables = Array.isArray(source.deliverables) ? source.deliverables : INITIAL_DELIVERABLES;
            const nextDesignBriefs = source.designBriefs && typeof source.designBriefs === 'object' ? source.designBriefs : INITIAL_DESIGN_BRIEFS;
            const nextChecklists = Array.isArray(source.checklists) ? source.checklists : INITIAL_CHECKLISTS;
            const nextIssues = Array.isArray(source.issues) ? source.issues : INITIAL_ISSUES;
            const nextActivities = Array.isArray(source.activities) ? source.activities : INITIAL_ACTIVITIES;
            const nextMeetings = Array.isArray(source.meetings) ? source.meetings : INITIAL_MEETINGS;
            const layout = source.layoutState || source;

            setEmployees(nextEmployees);
            setProjects(nextProjects);
            setDeliverables(nextDeliverables);
            setDesignBriefs(nextDesignBriefs);
            setChecklists(nextChecklists);
            setIssues(nextIssues);
            setActivities(nextActivities);
            setMeetings(nextMeetings);

            if (layout.roleMode) setRoleMode(layout.roleMode);
            if (layout.activeEmployeeId) setActiveEmployeeId(layout.activeEmployeeId);
            if (layout.activeTab) setActiveTab(layout.activeTab);
            if (layout.activeWorkbookSheet) setActiveWorkbookSheet(layout.activeWorkbookSheet);
            if (layout.selectedProjectId) setSelectedProjectId(layout.selectedProjectId);
            if (layout.projectViewSection) setProjectViewSection(layout.projectViewSection);
            if (layout.selectedEmployeeId) setSelectedEmployeeId(layout.selectedEmployeeId);

            try {
              window.localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify({
                  version: '1.0',
                  updatedAt: new Date().toISOString(),
                  employees: nextEmployees,
                  projects: nextProjects,
                  deliverables: nextDeliverables,
                  designBriefs: nextDesignBriefs,
                  checklists: nextChecklists,
                  issues: nextIssues,
                  activities: nextActivities,
                  meetings: nextMeetings,
                  roleMode: layout.roleMode || 'Admin',
                  activeEmployeeId: layout.activeEmployeeId || 'emp-6',
                  activeTab: layout.activeTab || 'sheet',
                  activeWorkbookSheet: layout.activeWorkbookSheet || 'projects_sheet',
                  selectedProjectId: layout.selectedProjectId || 'proj-4',
                  projectViewSection: layout.projectViewSection || 'brief',
                  selectedEmployeeId: layout.selectedEmployeeId || 'emp-1'
                })
              );
            } catch (storageErr) {}

            showToastMessage(`Restored backup from "${file.name}" & saved to browser storage!`);
          } catch (err) {
            showToastMessage('Failed to parse JSON backup file.', 'error');
          } finally {
            if (restoreFileInputRef.current) {
              restoreFileInputRef.current.value = '';
            }
          }
        };
        reader.readAsText(file);
      }, [showToastMessage]);

      const openEmployeeInspector = useCallback((empId) => {
        setInspectedEmployeeId(empId);
        setSelectedEmployeeId(empId);
      }, []);

      const openProjectDetailView = useCallback((projId, initialSection = 'brief') => {
        setPreviousTab(prev => (activeTab !== 'projects' ? activeTab : prev));
        setSelectedProjectId(projId);
        setProjectViewSection(initialSection);
        setActiveTab('projects');

        const proj = projects.find(p => p.id === projId);
        if (proj) {
          setAiPromptInputs({
            whatDesigning: proj.type || 'Architectural & Interior Design',
            companyAbout: `${proj.name} (${proj.plotSize}): ${proj.scopeSummary}`,
            targetAndVibe: `Client ${proj.client} seeking a high-precision, modern, and functional architectural solution led by ${proj.supervisor}.`
          });
        }
      }, [activeTab, projects]);

      const handleBackFromProject = useCallback(() => {
        setActiveTab(previousTab || 'sheet');
      }, [previousTab]);

      const handleToggleChecklistItem = (chkId) => {
        setChecklists(prev =>
          prev.map(item => (item.id === chkId ? { ...item, checked: !item.checked } : item))
        );
      };

      const handleSetWholeProjectProgress = (projId, pct) => {
        const clamped = Math.max(0, Math.min(100, Number(pct) || 0));
        const autoStatus = clamped === 100 ? 'Completed' : clamped === 0 ? 'Not Started' : 'In Progress';
        setDeliverables(prev =>
          prev.map(d =>
            d.projectId === projId
              ? { ...d, progress: clamped, status: autoStatus, dateCompleted: clamped === 100 ? '2026-10-22' : null }
              : d
          )
        );
        showToastMessage(`Project progress set to ${clamped}%`);
      };

      const handleResetProjectChecklist = (projId) => {
        setChecklists(prev =>
          prev.map(item => (item.projectId === projId ? { ...item, checked: false } : item))
        );
        handleSetWholeProjectProgress(projId, 0);
        showToastMessage('Project checklist and progress reset to 0%!');
      };

      const handleAddChecklistItem = (e) => {
        e.preventDefault();
        if (!newChecklistText.trim()) return;
        const newItem = {
          id: `chk-${Date.now()}`,
          projectId: selectedProjectId,
          category: newChecklistCategory || 'General',
          description: newChecklistText.trim(),
          checked: false
        };
        setChecklists(prev => [...prev, newItem]);
        setNewChecklistText('');
        showToastMessage('Checklist item added!');
      };

      const handleGenerateAiBrief = (e) => {
        e.preventDefault();
        const proj = projects.find(p => p.id === selectedProjectId);
        if (!proj) return;

        const existing = designBriefs[selectedProjectId] || INITIAL_DESIGN_BRIEFS['proj-4'];

        const updatedBrief = {
          ...existing,
          identification: {
            ...(existing.identification || {}),
            projectName: `${proj.name} — ${aiPromptInputs.whatDesigning}`,
            plotArea: proj.plotSize || existing.identification?.plotArea || 'As per site plan',
            orientation: `${proj.plotSize} (${proj.supervisor} Lead)`
          },
          aesthetics: {
            ...(existing.aesthetics || {}),
            style: aiPromptInputs.whatDesigning,
            integration: `${aiPromptInputs.companyAbout} | Target Experience: ${aiPromptInputs.targetAndVibe}`
          }
        };

        setDesignBriefs(prev => ({
          ...prev,
          [selectedProjectId]: updatedBrief
        }));

        setProjects(prev =>
          prev.map(p => (p.id === selectedProjectId ? { ...p, scopeSummary: aiPromptInputs.companyAbout } : p))
        );

        setShowAiBriefGeneratorModal(false);
        showToastMessage(`Architectural Requirement Sheet updated for "${proj.name}"!`);

      const addActivityLog = useCallback((logData) => {
        const activeEmp = employees.find(e => e.id === (logData.employeeId || (roleMode === 'Employee' ? activeEmployeeId : 'emp-1')));
        const newEntry = {
          id: `act-${Date.now()}`,
          employeeId: activeEmp ? activeEmp.id : 'emp-1',
          projectId: logData.projectId,
          deliverableId: logData.deliverableId || null,
          date: new Date().toISOString().replace('T', ' ').substring(0, 16),
          description: logData.description,
          hoursSpent: parseFloat(logData.hoursSpent || 0),
          isAuto: !!logData.isAuto
        };
        setActivities(prev => [newEntry, ...prev]);
      }, [employees, roleMode, activeEmployeeId]);

      const projectMetrics = useMemo(() => {
        const map = {};
        projects.forEach(p => {
          const pDels = deliverables.filter(d => d.projectId === p.id);

          const drawings = pDels.filter(d => d.type === 'Drawing/Plan');
          const models = pDels.filter(d => d.type === '3D Model');
          const renders = pDels.filter(d => d.type === 'Render');

          const dwgDone = drawings.filter(d => d.status === 'Completed').length;
          const mdlDone = models.filter(d => d.status === 'Completed').length;
          const rndDone = renders.filter(d => d.status === 'Completed').length;

          const total = pDels.length;
          const completedTotal = pDels.filter(d => d.status === 'Completed').length;

          const sumProgress = pDels.reduce((acc, d) => {
            if (d.status === 'Completed') return acc + 100;
            return acc + (Number(d.progress) || 0);
          }, 0);
          const progressPct = total > 0 ? Math.round(sumProgress / total) : 0;

          const getStageStatus = (items) => {
            if (items.length === 0) return 'N/A';
            const doneCount = items.filter(i => i.status === 'Completed').length;
            const wipCount = items.filter(i => i.status === 'In Progress' || i.status === 'Under Revision' || (i.progress > 0 && i.progress < 100)).length;
            if (doneCount === items.length) return `Done (${doneCount}/${items.length})`;
            if (doneCount > 0 || wipCount > 0) return `WIP (${doneCount}/${items.length})`;
            return `0% (0/${items.length})`;
          };

          map[p.id] = {
            drawings: { done: dwgDone, total: drawings.length, label: getStageStatus(drawings) },
            models: { done: mdlDone, total: models.length, label: getStageStatus(models) },
            renders: { done: rndDone, total: renders.length, label: getStageStatus(renders) },
            total,
            completedTotal,
            progressPct
          };
        });
        return map;
      }, [projects, deliverables]);

      const overallStudioProgress = useMemo(() => {
        if (!deliverables.length) return 0;
        const totalPct = deliverables.reduce((acc, d) => acc + (d.status === 'Completed' ? 100 : (Number(d.progress) || 0)), 0);
        return Math.round(totalPct / deliverables.length);
      }, [deliverables]);

      const masterProjectsSheetRows = useMemo(() => {
        return projects.map((p, idx) => {
          const m = projectMetrics[p.id] || { drawings: { label: '0%' }, models: { label: '0%' }, renders: { label: '0%' }, total: 0, completedTotal: 0, progressPct: 0 };
          const teamNames = p.assignedEmployees
            .map(id => employees.find(e => e.id === id)?.name)
            .filter(Boolean)
            .join(', ');

          return {
            'S.No': idx + 1,
            'Project Code': p.code || `VDS-${idx + 1}`,
            'Project Name': p.name,
            'Plot / Area Size': p.plotSize || '-',
            'Assigned Designer(s)': teamNames,
            'Supervisor / Lead': p.supervisor,
            'Complete Scope & Specifications': p.scopeSummary,
            'Floor Plans & Working Dwgs': m.drawings.label,
            '3D Models & Elevations': m.models.label,
            'PPT / Renders': m.renders.label,
            'Tasks Done': `${m.completedTotal} / ${m.total}`,
            'Progress (%)': `${m.progressPct}%`,
            'Target Date': p.targetDate,
            'Remarks': p.remarks || ''
          };
        });
      }, [projects, projectMetrics, employees]);

      const masterDeliverablesSheetRows = useMemo(() => {
        return deliverables.map((d, idx) => {
          const proj = projects.find(p => p.id === d.projectId);
          const emp = employees.find(e => e.id === d.assignedEmployeeId);
          return {
            'S.No': idx + 1,
            'Task ID': d.id,
            'Project Name': proj ? proj.name : '',
            'Plot / Area': proj ? proj.plotSize : '',
            'Category': d.subCategory || d.type,
            'Deliverable / Floor / Option Specification': d.name,
            'Assigned Designer': emp ? emp.name : 'Unassigned',

            'Progress (%)': `${d.status === 'Completed' ? 100 : (d.progress || 0)}%`,
            'Revisions': d.revisionCount,
            'Due Date': d.dateDue
          };
        });
      }, [deliverables, projects, employees]);

      const masterTeamSheetRows = useMemo(() => {
        return employees.map((e, idx) => {
          const empDels = deliverables.filter(d => d.assignedEmployeeId === e.id);
          const dwgs = empDels.filter(d => d.type === 'Drawing/Plan').length;
          const models = empDels.filter(d => d.type === '3D Model').length;
          const ppts = empDels.filter(d => d.type === 'Render').length;
          const done = empDels.filter(d => d.status === 'Completed').length;
          const pct = empDels.length > 0 ? Math.round(empDels.reduce((acc, d) => acc + (d.status === 'Completed' ? 100 : (d.progress || 0)), 0) / empDels.length) : 0;
          const projNames = e.assignedProjects.map(pid => projects.find(p => p.id === pid)?.name).filter(Boolean).join(' | ');

          return {
            'S.No': idx + 1,
            'Designer Name': e.name,
            'Role': e.role,
            'Division': e.division,
            'Supervisor': e.supervisor,
            'Assigned Projects': projNames || 'Available for Allocation',
            'Drawings / Working Dwgs': dwgs,
            '3D Models': models,
            'PPT / Renders': ppts,
            'Total Deliverables': empDels.length,
            'Completed': done,
            'Overall Progress (%)': `${pct}%`
          };
        });
      }, [employees, deliverables, projects]);

      const handleCopyForGoogleSheets = () => {
        const activeRows =
          activeWorkbookSheet === 'projects_sheet'
            ? masterProjectsSheetRows
            : activeWorkbookSheet === 'deliverables_sheet'
            ? masterDeliverablesSheetRows
            : masterTeamSheetRows;

        if (!activeRows.length) return;
        const keys = Object.keys(activeRows[0]);
        const tsv =
          keys.join('\t') +
          '\n' +
          activeRows
            .map(row => keys.map(k => String(row[k] ?? '').replace(/\t|\n/g, ' ')).join('\t'))
            .join('\n');

        const textArea = document.createElement('textarea');
        textArea.value = tsv;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          showToastMessage('Copied table! Press Ctrl+V / Cmd+V inside Google Sheets or Excel.');
        } catch (err) {
          showToastMessage('Could not copy automatically. Use Download Excel (.xls) button.', 'error');
        }
        document.body.removeChild(textArea);
      };

            : clamped === 0
            ? 'Not Started'

                      value={aiPromptInputs.whatDesigning}
                      onChange={e => setAiPromptInputs({ ...aiPromptInputs, whatDesigning: e.target.value })}
                      className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-emerald-300 mb-1">
                      2. What is the project / plot specification about? (Options, Floor-wise details, Plot size) *
                    </label>
                    <textarea
                      required
                      rows={4}
                      value={aiPromptInputs.companyAbout}
                      onChange={e => setAiPromptInputs({ ...aiPromptInputs, companyAbout: e.target.value })}
                      className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-emerald-300 mb-1">
                      3. Who is the target client/occupant and what architectural vibe are you going for? *
                    </label>
                    <textarea
                      required
                      rows={2}
                      value={aiPromptInputs.targetAndVibe}
                      onChange={e => setAiPromptInputs({ ...aiPromptInputs, targetAndVibe: e.target.value })}
                      className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2 border-t border-emerald-950">
                    <button
                      type="button"
                      onClick={() => setShowAiBriefGeneratorModal(false)}
                      className="px-4 py-2 bg-[#080d0a] text-slate-300 rounded-xl font-bold"
                    >
                      CANCEL
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl flex items-center gap-1.5"
                    >
                      <Icon name="sparkles" className="w-3.5 h-3.5" />
                      GENERATE & UPDATE DESIGN BRIEF
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD NEW PROJECT ROW MODAL */}
          {showNewProjectModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0b100d] border border-emerald-950 rounded-2xl w-full max-w-lg p-6 space-y-4 shadow-2xl font-mono text-xs">
                <div className="flex items-center justify-between border-b border-emerald-950 pb-3">
                  <h3 className="font-bold text-sm text-white uppercase">ADD NEW PROJECT ROW TO SHEET</h3>
                  <button onClick={() => setShowNewProjectModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateProject} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Project Name *</label>
                    <input required name="name" type="text" placeholder="e.g. New Residence Project" className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Plot / Area Size *</label>
                      <input required name="plotSize" type="text" placeholder="e.g. 30x50 West Facing" className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white" />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-300 mb-1">Assigned Designer *</label>
                      <select name="assignedEmployeeId" className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white">
                        {employees.map(emp => (
                          <option key={emp.id} value={emp.id}>{emp.name}</option>
                        ))}
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Detailed Scope (Floor Plans, 3D, Working Drawings) *</label>
                    <textarea required name="scopeSummary" rows={2} placeholder="Enter floor-wise or interior requirements..." className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowNewProjectModal(false)} className="px-4 py-2 bg-[#080d0a] text-slate-300 rounded-xl font-bold">CANCEL</button>
                    <button type="submit" className="px-5 py-2 bg-emerald-500 text-black font-bold rounded-xl">ADD TO SHEET</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* ADD NEW DELIVERABLE ROW MODAL */}
          {showNewDeliverableModal && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#0b100d] border border-emerald-950 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl font-mono text-xs">
                <div className="flex items-center justify-between border-b border-emerald-950 pb-3">
                  <h3 className="font-bold text-sm text-white uppercase">ADD DELIVERABLE ROW (0% START)</h3>
                  <button onClick={() => setShowNewDeliverableModal(false)} className="text-slate-400 hover:text-white">
                    <Icon name="x" className="w-4 h-4" />
                  </button>
                </div>

                <form onSubmit={handleCreateDeliverable} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Project *</label>
                    <select name="projectId" defaultValue={selectedProjectId} className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white">
                      {projects.map(p => (
                        <option key={p.id} value={p.id}>{p.name}</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Stage *</label>
                    <select name="type" className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white">
                      <option value="Drawing/Plan">Drawing / Floor Plan / Working Dwg</option>
                      <option value="3D Model">3D Model / Elevation</option>
                      <option value="Render">Presentation PPT / Render</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Deliverable Specification *</label>
                    <input required name="name" type="text" placeholder="e.g. Option 1 - 1st Floor Plan" className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-300 mb-1">Assigned Designer *</label>
                    <select name="assignedEmployeeId" className="w-full bg-[#080d0a] border border-emerald-950 rounded-xl px-3 py-2 text-white">
                      {employees.map(emp => (
                        <option key={emp.id} value={emp.id}>{emp.name}</option>
                      ))}
                    </select>
                  </div>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowNewDeliverableModal(false)} className="px-4 py-2 bg-[#080d0a] text-slate-300 rounded-xl font-bold">CANCEL</button>
                    <button type="submit" className="px-5 py-2 bg-emerald-500 text-black font-bold rounded-xl">ADD ROW</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* INSPECT DESIGNER MODAL */}
          {inspectedEmployeeId && (() => {
            const emp = employees.find(e => e.id === inspectedEmployeeId);
            if (!emp) return null;
            const empDels = deliverables.filter(d => d.assignedEmployeeId === emp.id);

            return (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-[#0b100d] border border-emerald-950 rounded-2xl w-full max-w-2xl p-6 space-y-4 shadow-2xl font-mono text-xs max-h-[85vh] overflow-y-auto">
                  <div className="flex items-center justify-between border-b border-emerald-950 pb-3">
                    <div>
                      <h3 className="text-lg font-black text-white">{emp.name}</h3>
                      <p className="text-emerald-400">{emp.role} • Lead: {emp.supervisor}</p>
                    </div>
                    <button onClick={() => setInspectedEmployeeId(null)} className="text-slate-400 hover:text-white">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                  <div className="space-y-2">
                    {empDels.map(del => {
                      const proj = projects.find(p => p.id === del.projectId);
                      return (
                        <div key={del.id} className="bg-[#080d0a] border border-emerald-950 p-3 rounded-xl flex items-center justify-between gap-2">
                          <div>
                            <span className="text-emerald-400 font-bold">[{proj?.name}]</span>{' '}
                            <span className="text-white">{del.name}</span>
                          </div>
                          <span className="text-amber-400 font-bold">{del.status} ({del.progress || 0}%)</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            );
          })()}

          <footer className="border-t border-emerald-950/80 bg-[#080c0a] py-4 text-center text-[10px] font-mono text-slate-500 tracking-widest uppercase">
            VIRINCHI MASTER EXCEL TRACKER · 14 PROJECTS · 39 DELIVERABLES · LOCAL BACKUP & RESTORE READY
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
